<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dragonfly benchmark results by stack version: download duration and throughput per cache state." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='7' y='2' width='2' height='12' fill='%23ff3001'/%3E%3C/svg%3E" />
    <title>Dragonfly compose-bench</title>
    <script>
      // Apply saved theme / language before first paint. Default theme is light; keys match src/prefs.tsx.
      (function () {
        var d = document.documentElement, t = null, l = null;
        try {
          t = localStorage.getItem("compose-bench.theme");
          l = localStorage.getItem("compose-bench.lang");
        } catch (e) {}
        t = t === "dark" ? "dark" : "light";
        if (l !== "zh" && l !== "en") l = /^zh(-|_|$)/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "") ? "zh" : "en";
        d.dataset.theme = t;
        d.style.colorScheme = t;
        d.lang = l === "zh" ? "zh-CN" : "en";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#000000" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
