# dfperf origin: serves the fixtures volume read-only and writes one JSON line
# per request to a log volume the runner can read (it has no docker.sock).
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  default_type application/octet-stream;
  etag on;

  log_format dfperf escape=json '{"ts":$msec,"remote":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$bytes_sent,"body_bytes":$body_bytes_sent,'
    '"range":"$http_range","ua":"$http_user_agent","rt":$request_time}';

  server {
    listen 80;
    server_name origin;
    access_log /var/log/dfperf-origin/access.jsonl dfperf;
    access_log /dev/stdout dfperf;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location /files/ {
      alias /fixtures/files/;
    }

    location = /manifest.json {
      access_log off;
      alias /fixtures/manifest.json;
    }
  }
}
