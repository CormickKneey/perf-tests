# Build compose-bench/dashboard and deploy dist/ to GitHub Pages.
# Source is GitHub Actions (upload-pages-artifact + deploy-pages).
# Vite base is "./", so the site works at https://<owner>.github.io/<repo>/.
#
# Repository secrets, exact names, anon/publishable key only:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# Never add a secret key, or any key whose JWT role is not anon.
# If either secret is unset the build still succeeds and the dashboard
# falls back to local ./data.
# One-time: Settings -> Pages -> Source: GitHub Actions.
# See compose-bench/docs/results-store.md.

name: Dashboard Pages

on:
  push:
    branches: [main]
    paths:
      - compose-bench/dashboard/**
      - .github/workflows/dashboard-pages.yml
  workflow_dispatch:

# Build only needs to read the repo. Deploy publishes the artifact.
# Each job narrows this set further.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: compose-bench/dashboard/package-lock.json

      - name: Build
        working-directory: compose-bench/dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY is unset; the site will use local ./data."
          else
            echo "Supabase URL and anon key are set for the dashboard build. Values are not printed."
          fi
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: compose-bench/dashboard/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
